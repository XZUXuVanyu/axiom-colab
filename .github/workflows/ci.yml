name: CI

on:
  push:
  pull_request:

jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - if: runner.os == 'Windows'
        run: cmake -S . -B build/windows -DCMAKE_BUILD_TYPE=Release
      - if: runner.os != 'Windows'
        run: cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release
      - if: runner.os == 'Windows'
        run: cmake --build build/windows --config Release --parallel
      - if: runner.os != 'Windows'
        run: cmake --build build/linux --config Release --parallel
      - if: runner.os == 'Windows'
        run: ctest --test-dir build/windows -C Release --output-on-failure
      - if: runner.os != 'Windows'
        run: ctest --test-dir build/linux -C Release --output-on-failure
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CPP_BRIDGE_PATH = (Resolve-Path .\build\windows\Release\cpp-tool-bridge.exe)
          pnpm test:integration
      - if: runner.os != 'Windows'
        run: CPP_BRIDGE_PATH="$PWD/build/linux/cpp-tool-bridge" pnpm test:integration
